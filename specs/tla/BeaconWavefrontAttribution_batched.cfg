\* Model config — BATCHED mode (Trace = FALSE) for BeaconWavefrontAttribution.tla
\* (change: beacon-wavefront-attribution). Owner: design-gate.
\*
\* PURPOSE: demonstrate the BUG is real. This config models the shipped
\* production wavefront path — the MetalFrameEncoder batches many kernels into one
\* command buffer and stamps the mmap cell at ENCODE time, so the cell holds the
\* LAST-ENCODED kernel of the batch. When a NON-last kernel of the batch wedges,
\* the parent reads the wrong kernel.
\*
\* REQUIRED OUTCOME (a run that does otherwise is a REJECT):
\*   - NoMisattribution  MUST be VIOLATED. TLC must return a counterexample whose
\*     final state has parentPhase="read_beacon" with reported # inflight — a
\*     non-last kernel of the in-flight batch hung while the cell named the
\*     last-encoded kernel. That counterexample IS the evidence.
\*   - No OTHER listed invariant may be violated. In particular NoPhantomReport
\*     HOLDS (the report is always SOME reached kernel), which proves the batched
\*     defect is a MISATTRIBUTION among reached kernels, not an out-of-set
\*     phantom. TypeOK and WriterQuiescentWhenHung also hold.
\*
\* Liveness is not checked here: a safety violation halts BFS, so HungIsReported
\* is moot in this mode and is proved by the FIXED config instead.
\*
\* BOUNDS: KernelSeqDef == <<1, 2, 3>> (a batch of 3), routed via `<-` because
\* TLC's .cfg grammar cannot take a sequence literal on a CONSTANT. NONE=0 is not
\* a kernel. The batched wedge may land on ANY kernel of the command buffer.
\*
\* CHECK_DEADLOCK FALSE: same benign healthy-completion terminal as the parent
\* change — child idle at idx>SeqLen while the parent still polls. TLC's default
\* deadlock check would otherwise fire on that legitimate end state.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANT KernelSeq <- KernelSeqDef
CONSTANT Trace = FALSE

INVARIANTS
    TypeOK
    NoPhantomReport
    WriterQuiescentWhenHung
    NoMisattribution
