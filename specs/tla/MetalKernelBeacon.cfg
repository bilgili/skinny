\* Model config for MetalKernelBeacon.tla  (change: metal-kernel-beacon)
\* Owner: design-gate. The spec-author's .tla and .md stay untouched.
\*
\* ---------------------------------------------------------------------------
\* WHY `SPECIFICATION Spec` (not INIT/NEXT):
\*   HungIsReported is a liveness property. It holds only under the weak-fairness
\*   conjunct that lives inside Spec (Init /\ [][Next]_vars /\ Fairness). Declaring
\*   INIT/NEXT alone would drop Fairness and report a spurious liveness violation.
\*   So the whole Spec is the behavior predicate here.
\*
\* BOUNDS / ASSUMPTIONS (small, bounded — stated per tla-checker contract):
\*   KernelSeq <- KernelSeqDef, and KernelSeqDef == <<1, 2>> in the module — the
\*   child dispatches two kernels, ids 1 and 2, in order. NONE = 0 is not a
\*   kernel (the module ASSUMEs it). Two kernels are enough to exercise a hang on
\*   the SECOND dispatch after a clean FIRST one, which is the case where "the
\*   cell must name exactly N, not N-1" bites. TLC's .cfg grammar cannot take a
\*   sequence literal on a CONSTANT, so the bound is defined by the module
\*   operator KernelSeqDef and routed in with `<-`; this changes no bound.
\*
\* OPEN-QUESTION RULING (GPU shader-side store): KEEP it in the MVP.
\*   On a hang the child is wedged in wait_for_idle() and can never read back the
\*   UMA `beaconStore` write, so that write adds ZERO information to the host
\*   report on the load-bearing path — which is exactly why the .tla does NOT
\*   model it (the mmap host stamp is the only thing the parent reads). It is
\*   kept because deferring it would re-freeze the 256-B layout and re-touch all
\*   ~38 kernels a second time; it is gated off in production (zero prod cost)
\*   and one u32 store is negligible in a traced build. The safety model is
\*   correct to exclude it: it is off the report path.
\*
\* VERDICT: APPROVE. The earlier REJECT (SV-1) is resolved: the shader-variant-key
\*   spec now rides `metal_trace` on the Metal `base` segment → `session_defines()`
\*   ONLY, does not touch the Vulkan-only `cache_token()`/`spv_cache_key()` seams,
\*   and the "distinct cache files" framing is gone (no Metal .spv disk cache
\*   exists). The beacon protocol these properties model was never the defect and
\*   is sound; every INVARIANT and the PROPERTY below are expected to PASS.
\* ---------------------------------------------------------------------------

SPECIFICATION Spec

\* Benign healthy-completion terminal: when the child stamps+dispatches+completes
\* every kernel it sits idle at idx>SeqLen while the parent still polls, so every
\* Next disjunct is disabled. TLC's counterexample proved this is the SOLE
\* terminal (no invariant violated in the 12 states), and it models the real
\* parent poll loop ending on the child's clean exit — not a stuck state. Disable
\* the default deadlock check so BFS completes the graph; masks no real terminal.
CHECK_DEADLOCK FALSE

CONSTANT KernelSeq <- KernelSeqDef

INVARIANTS
    TypeOK
    NoPhantomReport
    NoTornOrStaleRead
    ReportIsRealKernel

PROPERTIES
    HungIsReported
