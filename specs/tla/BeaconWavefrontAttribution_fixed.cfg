\* Model config — FIXED mode (Trace = TRUE) for BeaconWavefrontAttribution.tla
\* (change: beacon-wavefront-attribution). Owner: design-gate.
\*
\* PURPOSE: prove the FIX. Under SKINNY_METAL_TRACE the MetalFrameEncoder degrades
\* to per-kernel submit — it stamps, submits ONE kernel as its own command buffer,
\* and drains before it encodes the next. So at most one kernel is ever in flight
\* and the mmap cell always names the in-flight (possibly hung) kernel. In the
\* model, CanEncode requires `Trace => batch = {}`, forcing batch (and hence
\* flying) to a singleton.
\*
\* REQUIRED OUTCOME (any violation, or an incomplete graph, is a REJECT):
\*   - Complete state graph, no deadlock (CHECK_DEADLOCK FALSE handles the benign
\*     healthy-completion terminal).
\*   - ALL invariants HOLD:
\*       TypeOK                    — well-typed state.
\*       NoMisattribution          — the point of the change: reported = inflight.
\*       NoPhantomReport           — report is a reached kernel (also held batched).
\*       WriterQuiescentWhenHung   — seqlock closed while hung; parent reads a
\*                                   committed cell (formalizes the seqlock comment).
\*       AtMostOneInFlight         — Trace => |flying| =< 1 (per-kernel submit).
\*   - LIVENESS HungIsReported HOLDS: a hung kernel is eventually reported through
\*     the SIGTERM -> read chain, under weak fairness on TimedOut / SigTerm /
\*     ReadBeacon.
\*
\* BOUNDS: KernelSeqDef == <<1, 2, 3>>, routed via `<-` (see the batched config).
\* NONE=0 is not a kernel.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANT KernelSeq <- KernelSeqDef
CONSTANT Trace = TRUE

INVARIANTS
    TypeOK
    NoMisattribution
    NoPhantomReport
    WriterQuiescentWhenHung
    AtMostOneInFlight

PROPERTIES
    HungIsReported
